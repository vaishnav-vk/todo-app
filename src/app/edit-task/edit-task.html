
<div class="edit-container">

  <h2>Edit Task</h2>

  <div class="form-group">
    <label>Task Title</label>

    <input
      type="text"
      [(ngModel)]="title"
      placeholder="Enter task title"
    >
  </div>

  <div class="form-group">
    <label>Description</label>

    <textarea
      [(ngModel)]="description"
      placeholder="Enter task description"
    ></textarea>
  </div>

  <button
    class="save-btn"
    (click)="editTask()">
    Save Changes
  </button>

</div>
